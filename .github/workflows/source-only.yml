name: Source-only repository
on: [push, pull_request]
permissions:
  contents: read
jobs:
  original-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_repository_assets.py
      - run: python -m unittest discover -s tests -p test_asset_policy.py
